name: Oyaroo Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Flutter Analyze and Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Oyaroo
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure Android Flutter SDK path
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Run Flutter tests
        run: flutter test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Oyaroo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Configure Android Flutter SDK path
        run: echo "flutter.sdk=$FLUTTER_ROOT" > android/local.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/oyaroo-release.jks"
          chmod 600 "$RUNNER_TEMP/oyaroo-release.jks"

      - name: Build signed ARM64 release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/oyaroo-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: oyaroo-arm64-release-apk
          path: build/app/outputs/flutter-apk/*-arm64-v8a-release.apk
          if-no-files-found: error
